services:
  - type: web
    name: makeup-and-care-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 60 --keep-alive 30
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      # Neon: строка подключения вида postgresql://user:pass@ep-xxx.neon.tech/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Cloudinary: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
